[package]
name = "ds2-save-manager"
version = "0.1.0"
description = "Dark Souls II save manager: edit, convert and transfer saves between the original game and Scholar of the First Sin."
authors = ["Mert"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "ds2save"
path = "src/lib.rs"

[[bin]]
name = "ds2-save-manager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes = "0.8"
cbc = "0.1"
md-5 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[profile.dev.package."*"]
opt-level = 2
