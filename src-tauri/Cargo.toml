[package]
name = "ds2-save-manager"
version = "0.7.2"
description = "Dark Souls II save manager: edit, convert and transfer saves between the original game and Scholar of the First Sin."
authors = ["Mert"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "ds2save"
path = "src/lib.rs"

[[bin]]
name = "ds2-save-manager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes = "0.8"
cbc = "0.1"
md-5 = "0.10"
ctr = "0.9"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Linux and the Steam Deck read pads through evdev.
[target.'cfg(not(windows))'.dependencies]
gilrs = "0.11"

[target.'cfg(windows)'.dependencies]
# XInput, not gilrs' default Windows Gaming Input: WGI only reports a pad while a window of this
# process holds the keyboard focus, and in a Tauri app WebView2's own window (another process)
# holds it as soon as the page is clicked, after which no press arrives at all.
gilrs = { version = "0.11", default-features = false, features = ["xinput"] }
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
dirs = "7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[profile.dev.package."*"]
opt-level = 2
