name: Release

# Builds the Windows installer (NSIS) and portable zip and the Linux AppImage (the Steam Deck's
# format: SteamOS is read-only, so no deb or rpm), and uploads them to a DRAFT release whose
# notes come from changelog/<version>.en.md and .tr.md. Nothing is published and no tag is
# made here: publishing the draft, which creates its tag, is done by hand.
#
# Runs by hand (Actions > Release > Run workflow) on any branch, or when a v* tag is pushed;
# the tag must then be v<version in package.json>. Running again for the same version reuses
# its draft and replaces the files on it; a version that is already published is refused.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.draft.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the version, the release notes and the tag
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/version.mjs --check "$TAG"

      - name: Create or reuse the draft
        id: draft
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            const tag = `v${version}`;
            const notes = (lang) => fs.readFileSync(`changelog/${version}.${lang}.md`, 'utf8').trim();
            const body = `## English\n\n${notes('en')}\n\n## Türkçe\n\n${notes('tr')}\n`;
            const name = `DS2 Save Manager ${version}`;
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            if (releases.some((r) => r.tag_name === tag && !r.draft)) {
              core.setFailed(`${tag} is already published; raise the version (node scripts/version.mjs minor|patch).`);
              return;
            }
            const draft = releases.find((r) => r.tag_name === tag && r.draft);
            if (draft) {
              await github.rest.repos.updateRelease({ owner, repo, release_id: draft.id, name, body, target_commitish: context.sha });
              for (const asset of draft.assets) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
              }
              core.info(`Reusing draft ${draft.id} for ${tag}`);
              return draft.id;
            }
            const { data } = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, target_commitish: context.sha, name, body, draft: true, prerelease: false,
            });
            core.info(`Created draft ${data.id} for ${tag}`);
            return data.id;

  build:
    name: Build · ${{ matrix.name }}
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          # The oldest base with WebKitGTK 4.1, so the AppImage runs on older glibc too.
          - name: Linux AppImage
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries (WebKitGTK for Tauri, udev for game controllers, AppImage tools)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libudev-dev patchelf libfuse2 file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # NSIS on Windows (tauri.conf.json), AppImage on Linux (tauri.linux.conf.json).
      - name: Build and upload the bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}

      - name: Portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/portable.ps1

      - name: Upload the portable zip
        if: runner.os == 'Windows'
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = 'src-tauri/target/release/bundle/portable';
            for (const file of fs.readdirSync(dir).filter((f) => f.endsWith('.zip'))) {
              const data = fs.readFileSync(path.join(dir, file));
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo,
                release_id: Number(process.env.RELEASE_ID),
                name: file.replace(/ /g, '.'),
                data,
                headers: { 'content-type': 'application/zip', 'content-length': data.length },
              });
              core.info(`Uploaded ${file}`);
            }
